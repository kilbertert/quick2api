# quick2api 配置模板。未注释的键建议过一眼；注释掉的块是可选调优
#（默认值写在注释里，不取消即按默认走）。最小起步零编辑：
# 桌面版 Amazon Quick 登录过的机器上，跑 `quick2api -probe` 直接验证链路。

server:
  # 只绑回环——这台机器就是上游凭据的边界；对外暴露请走反代。
  listen: "127.0.0.1:8377"
  # 同时运行的 /v1/* 完成请求数上限；多余的请求直接 429 快速失败，
  # 不在本地排队——Quick 账号配额是共享的，排队救不了它。
  max_concurrency: 16
  # 模型 API 请求体上限（完整历史、工具定义及编码后的附件），默认 32 MiB。
  # 可设 1..134217728 字节；0 使用默认值。超限返回 HTTP 413，不截断历史。
  # 内部工具结果中继使用独立的小额上限，不受此选项影响。
  # max_request_body_bytes: 33554432
  # 单次上游回合（ws open → message_complete）的最大时长秒数。默认 600。
  # turn_timeout_seconds: 600

debug:
  # 请求级调试记录：每个请求一个目录 <state>/debug/<ts>-<id>/，
  # 含 00-request/01-frames/02-response。开起来排障才有弹药。
  enabled: true
  # 调试目录保留天数，按启动时一次性清理；<=0 不清。默认 14。
  # retention_days: 14
  # 额外记录上行所有协议帧到 01-frames（文本帧不含凭据，放心开）。默认 false。
  # log_frames: true

quick:
  # quickwork-agent 二进制路径。空值自动探测标准位置：
  #   Windows: %LOCALAPPDATA%\quickwork\agent\quickwork-agent.exe
  #   Linux:   ~/.local/share/quickwork/agent/quickwork-agent
  # agent_path: ""
  # agent 需要的 -manifest 参数（桌面装的就是 desktop）。默认 desktop。
  # manifest: "desktop"
  # QUICKWORK_BUILD_STAGE 环境变量；正式装必须 prod，缺这个 agent 直接
  # RuntimeError 退出。默认 prod。
  # build_stage: "prod"
  # 已通过 Quick UI 授权 MCP 的现有账号目录（传给自建 outpost 的 QUICKWORK_ROOT）。
  # 空值沿用当前进程环境；不会自动切换账号，也不会创建或复制授权。
  # profile_root: "C:/Users/<user>/.quickwork/profiles/<profile-id>"
  # 我们自建的 outpost 监听端口。0 = 自动挑空闲回环端口（推荐，
  # 上次崩溃残留的实例不会撞车）。绝对不要复用 8780——那是桌面应用
  # 自己的 outpost，它的 bearer 只活在那个应用的主进程内存里。
  # outpost_port: 0
  # 跳过自启 outpost、直接指向一个已在跑的实例时两个键一起填：
  # outpost_url: "http://127.0.0.1:8781"
  # outpost_token: "<该实例的 stdin token>"
  # 或者从文件加载一份抓下来的 sncs-session（CI/测试逃逸口，与上面互斥）：
  # session_file: "./sess.json"
  # AIDP 双向流参数（一般不用动）：
  # surface_type: "QUICK_WORK_DESKTOP_WINDOWS"
  # channel: "prod"
  # origin: "https://quick.aws.com"
  # 发给上游的会话环境。
  user_timezone: "Asia/Shanghai"
  user_locale: "zh-CN"
  # 缺省 agent_mode（客户端 model 未命中 agent_modes 时使用）。实测
  # turn_usage.model 回 "smart"、resolved_model_id 回真实模型名。
  default_agent_mode: "smart"
  # thinking_effort 透传值（low/medium/high/max）；客户端 reasoning_effort
  # 优先于它。空值不发。
  # thinking_effort: ""
  # 严格握手：session_connect/session_create 未等到 ACK 即失败而非继续
  # 发送（服务端偶尔会漏 ACK，默认 false 更稳）。
  # strict_handshake: false
  # handshake_timeout_seconds: 10
  # 客户端 model 名 → 上游 agent_mode 的映射；同时是 /v1/models 的广告面。
  agent_modes:
    quick: "smart"
    quick-smart: "smart"
    # 实测上游回 resolved_model_id = "us.anthropic.claude-opus-5-5"；
    # 若上游支持别的 agent_mode 值，在这里加键。
  # 额外只用于 /v1/models 展示的别名：
  # models:
  #   - "claude-opus-5-5"
  # sncs-session 复用秒数；到期重新向 outpost 取（token 本身由 outpost 管
  # 理，约 7 天可用期）。默认 600——比上游实际寿命长得多没关系，取新的
  # 成本就是一次本地 HTTP。
  # session_ttl_seconds: 600
  # 上行 WSS 的 HTTP 代理；留空走系统 HTTPS_PROXY/HTTP_PROXY，
  # "direct" 强制直连。
  # proxy: ""

  # 账号池（v1.1+）。默认只有一条 lane（上面顶层字段决定）。配了 accounts
  # 后每个 entry 是一条独立 lane：
  #   - outpost_url + outpost_token  → attach 一个跑着的 outpost
  #   - session_file                 → 直接读 sncs-session JSON
  #   - 全空                         → 用顶层 AgentPath/Manifest 本地 spawn
  # lane 间 round-robin；某 lane 回 401/403/5xx 会进 cooldown_seconds 冷却。
  # 注意：同机 spawn 的多个 lane 会共享同一份登录凭据——真正的多账号
  # 要么给不同机器 outpost_url、要么给不同 session_file。
  # accounts:
  #   - name: primary
  #     outpost_url: "http://127.0.0.1:8780"
  #     outpost_token: "64-hex-token"
  #   - name: secondary
  #     outpost_url: "http://127.0.0.1:8781"
  #     outpost_token: "another-64-hex"
  # cooldown_seconds: 60           # 每个 lane 可覆盖此默认值
  #
  # 会话亲和：客户端给的 conversation_id / X-Conversation-Id / X-Session-Id
  # 命中某条已 alive 的 pooled WS 时，本请求直接钉在那条 lane 上——
  # 不需要 TTL 表。conn 池本身由下面两管：
  # conn_idle_ttl_seconds: 3600     # 超期未用的 pooled conn 关掉
  # max_pooled_conns: 256           # 池上限，LRU 淘汰最旧
  #
  # 每条 lane 后台周期重取 session 探活：401/403 提前冷却该 lane，
  # 健康时清掉 cooldown 恢复。0 = 关探针（单 lane 默认 300s）。
  # health_probe_seconds: 300

api:
  # 下游 /v1/* 的 Bearer 校验。空值=不校验——只在 listen 为回环时可接受。
  # 本机用给自己起一个长一点的随机串即可：
  # api_key: "q2a-local-<随机>"

tools:
  # Anthropic 客户端工具传输。默认 prompt 兼容模式。
  # mcp 是实验性原生桥，必须先在代理自建 outpost 正式注册 relay。
  # 不会自动注册，也不会在失败后退回文字 JSON。见 docs/native-client-relay.md。
  # client_transport: prompt
  # native_relay_name: "<注册目录中的完整 quick2api_client_call 名称>"
  # bridge_timeout_seconds: 300
  # 服务器端工具执行器。开了以后 /v1/messages 的 tool_use 不再是"建议模型
  # 怎么答"，而是真的在这台机器上执行后再把 tool_result 喂回去——多轮
  # tool-loop 由 proxy 自己跑，客户端照常收 end_turn。
  #
  # 打开 bash/files 任一项即激活执行器；都不开 = advisory 模式（schema
  # 进 prompt、tool_use 原样返回）。
  #
  # mode 决定"客户端声明 tools"跟"服务器 executor"谁赢：
  #   auto        （默认）客户端声明了 tools → passthrough（你跑工具）；
  #               没声明 → server（proxy 跑）
  #   passthrough 永远把 tool_use 原样回给客户端（executor 空转）
  #   server      永远 server-side 执行；客户端声明的 tools 仅作 schema 提示
  # mode: auto
  # bash:
  #   enabled: true
  #   # 允许的命令形态，glob/前缀匹配；空列表=不限制（慎用）。
  #   allow: ["git *", "ls *", "cat *", "go build *", "go test *"]
  #   cwd: "/home/claude/Playground"       # 空值用 files.root 或进程 cwd
  #   timeout_seconds: 60
  # files:
  #   enabled: true
  #   # 所有 Read/Write/Edit/Glob/Grep/LS 的路径都被关在这个根目录里，
  #   # 模型写不出这个圈。空值 = 当前工作目录。
  #   root: "/home/claude/Playground"
  # tool_use → tool_result → 再发一轮 的循环上限，防模型连环调。默认 4。
  # max_tool_rounds: 8
